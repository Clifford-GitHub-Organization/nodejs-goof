version: 2.1

orbs: 
  snyk: snyk/snyk@1.1.2

jobs:
  snyk-scan:
    docker:
      - image: cimg/openjdk:11.0
    steps:
      - checkout
      - run:
          name: Conditional Snyk Scan
          command: |
            if [ -f package.json ] || [ -f requirements.txt ] || [ -f pom.xml ]; then
              snyk monitor
            else
              echo "No manifest file found. Skipping Snyk scan."
            fi

workflows:
  build-test-snyk:
    jobs:
      - snyk-scan

